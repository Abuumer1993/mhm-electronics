<!-- ============ LOGIN ============ -->
<div id="loginScreen" class="login-screen">
  <div class="login-card">
    <div id="lsLogin"></div>
    <img class="logo-big" src="logo.png" alt="MHM">
    <h1>MHM <span>ELECTRONICS</span></h1>
    <div class="tag">INSTALLMENT &amp; EASY PAYMENT</div>
    <p style="margin:4px 0" data-i18n="app_admin"></p>
    <input type="password" id="pwd" data-i18n-ph="password" onkeydown="if(event.key==='Enter')login()">
    <button class="btn gold block" onclick="login()" data-i18n="enter"></button>
  </div>

<header class="topbar">
  <div class="topbar-start">
    <div class="brand-wrap"><img src="logo-192.png" alt=""><div class="brand"><b>MHM <span>ELECTRONICS</span></b><small>ADMIN PANEL</small></div></div>
  </div>
  <div class="topbar-end">
    <button class="sq-btn" onclick="refreshPage()" aria-label="Refresh"><svg class="ico"><use href="#i-refresh"/></svg></button>
    <button class="menu-btn" onclick="toggleMenu()" aria-label="Menu"><svg class="ico"><use href="#i-menu"/></svg></button>

</header>

<main>
  <!-- HOME -->
  <section id="p-home" class="page hidden">
    <div class="frame-shadow"><div class="hero">
      <img class="hero-logo" src="logo-192.png" alt="">
      <div class="sub" data-i18n="today_coll"></div>
      <div class="big" id="hToday">Rs 0</div>
      <div class="sub"><span data-i18n="this_month"></span>: <span class="num" id="hMonth">Rs 0</span></div>
    </div></div>
    <div id="alerts"></div>
    <div class="stats">
      <div class="stat-wrap"><div class="stat y"><div class="stat-ico"><svg class="ico"><use href="#i-wallet"/></svg></div><div class="stat-txt"><span data-i18n="total_bal"></span><b id="hBal">0</b></div></div></div>
      <div class="stat-wrap"><div class="stat b"><div class="stat-ico"><svg class="ico"><use href="#i-box"/></svg></div><div class="stat-txt"><span data-i18n="active_deals"></span><b id="hActive">0</b></div></div></div>
      <div class="stat-wrap"><div class="stat g"><div class="stat-ico"><svg class="ico"><use href="#i-chart"/></svg></div><div class="stat-txt"><span data-i18n="month_profit"></span><b id="hProfit">0</b></div></div></div>
      <div class="stat-wrap"><div class="stat o"><div class="stat-ico"><svg class="ico"><use href="#i-clock"/></svg></div><div class="stat-txt"><span data-i18n="late_accounts"></span><b id="hLate">0</b></div></div></div>
    </div>

      <h3 data-i18n="late_inst"></h3>

    </div>

  <!-- PAYMENTS -->
  <section id="p-pays" class="page hidden">
    <h2 class="title" data-i18n="m_pays"></h2>
    <div class="subtabs" id="paySubtabs">
      <button data-s="Pending Shop" onclick="payFilter('Pending Shop')"><i class="dot y"></i><span data-i18n="tab_proofs"></span></button>
      <button data-s="Shop Received" onclick="payFilter('Shop Received')"><i class="dot b"></i><span data-i18n="tab_custpending"></span></button>
      <button data-s="Confirmed" onclick="payFilter('Confirmed')"><i class="dot g"></i><span data-i18n="tab_confirmed"></span></button>
      <button data-s="Rejected" onclick="payFilter('Rejected')"><i class="dot r"></i><span data-i18n="tab_rejected"></span></button>
      <button data-s="" onclick="payFilter('')"><i class="dot k"></i><span data-i18n="all"></span></button>

  <!-- CUSTOMERS -->

      <div id="custList"></div>

        <div><label><span data-i18n="mobile_wa"></span> *</label><input id="c_mobile" type="tel" placeholder="03001234567"></div>

        <div><label data-i18n="g_mobile"></label><input id="g_mobile" type="tel"></div>
        <div><label data-i18n="g_address"></label><input id="g_address"></div>

        <div><label><span data-i18n="item_type"></span> *</label><select id="d_itemType"></select></div>
        <div><label><span data-i18n="company"></span> *</label><input id="d_company"></div>

        <div><label data-i18n="color"></label><input id="d_color"></div>

<div id="modalHost"></div>
<div id="toast"></div>
<div id="loading"><div class="spinner"></div></div>

<script>
var PWD = '', SHOP = { shopName: 'MHM Electronics' }, curCust = null, curPayStatus = 'Pending Shop', curLoginStatus = 'Pending', searchTimer = null, editId = '';
var PAGES = ['home', 'pays', 'custs', 'cust', 'custForm', 'dealForm', 'logins', 'settings'];

['lsLogin', 'lsSide', 'lsSettings'].forEach(function (id) { $(id).innerHTML = langSwitchHtml(); });

function fillItemTypes() {
  var sel = $('d_itemType'), cur = sel.selectedIndex;
  sel.innerHTML = t('items').map(function (x) { return '<option>' + esc(x) + '</option>'; }).join('');
  if (cur > 0) sel.selectedIndex = cur;
}

function currentPage() { return PAGES.filter(function (x) { return !$('p-' + x).classList.contains('hidden'); })[0] || ''; }

window.onLangChange = function () {
  fillItemTypes();
  $('custFormTitle').textContent = editId ? t('cf_title_edit') : t('m_newcust');
  if (PWD) refreshPage();
};

function login() {
  var p = $('pwd').value;
  if (!p) return;
  api('adminLogin', [p]).then(function (res) {
    PWD = p; SHOP = res;
    store('mhm_admin', p);
    $('loginScreen').classList.add('hidden');
    $('s_mobile').value = res.shopMobileRaw || '';
    go('home');
  }).catch(function (e) { fail(e); store('mhm_admin', null); });
}
function logout() { PWD = ''; store('mhm_admin', null); $('pwd').value = ''; toggleMenu(false); $('loginScreen').classList.remove('hidden'); }
function adminFail(e) { if (String(e.message) === 'WRONG_PASSWORD') logout(); fail(e); }

function toggleMenu(open) {
  var sb = $('sidebar');
  if (open === undefined) open = !sb.classList.contains('open');
  sb.classList.toggle('open', open);
  $('overlay').classList.toggle('show', open);
}
function show(p) {
  PAGES.forEach(function (x) { $('p-' + x).classList.add('hidden'); });
  $('p-' + p).classList.remove('hidden');
  var nav = { cust: 'custs', custForm: (editId ? 'custs' : 'newCust'), dealForm: 'custs' }[p] || p;
  var b = document.querySelectorAll('#nav [data-p], #dock [data-p]');
  for (var i = 0; i < b.length; i++) b[i].classList.toggle('active', b[i].getAttribute('data-p') === nav);
  toggleMenu(false);
  window.scrollTo(0, 0);
}
function go(p, noPush) {
  show(p);
  if (!noPush) history.pushState({ p: p }, '', '#' + p);
  if (p === 'home') loadHome();
  if (p === 'pays') payFilter(curPayStatus);
  if (p === 'custs') doSearch();
  if (p === 'logins') loginFilter(curLoginStatus);
  if (p === 'settings') $('portalLink').textContent = portalUrl();
}
window.onpopstate = function (e) {
  closeModal();
  var p = (e.state && e.state.p) || 'home';
  if (p === 'cust' && curCust) { show('cust'); return; }
  if (p === 'custForm' || p === 'dealForm') { show(p); return; }
  go(p, true);
};
function refreshPage() {
  var cur = currentPage() || 'home';
  if (cur === 'cust' && curCust) openCustomer(curCust.customer.id, true);
  else if (cur === 'custForm' || cur === 'dealForm') show(cur);
  else go(cur, true);
}
function copyText(x) {
  if (navigator.clipboard) navigator.clipboard.writeText(x).then(function () { toast(t('copied')); });
  else prompt('', x);
}

// ---------- Home ----------
function loadHome() {
  api('getDashboard', [PWD], true).then(function (d) {
    $('hToday').textContent = money(d.todayTotal);
    $('hMonth').textContent = money(d.monthTotal);
    $('hBal').textContent = money(d.totalBalance);
    $('hActive').textContent = d.activeDeals;
    $('hProfit').textContent = money(d.monthProfit);
    $('hLate').textContent = d.overdue.length;
    setBadge('nbPays', d.pendingShop);
    setBadge('nbLogins', d.pendingLogins);
    var a = '';
    if (d.pendingShop) a += alertCard(t('al_proofs'), d.pendingShop, "go('pays');payFilter('Pending Shop')");
    if (d.pendingLogins) a += alertCard(t('al_logins'), d.pendingLogins, "go('logins')");
    if (d.pendingCustomer) a += alertCard(t('al_custconf'), d.pendingCustomer, "go('pays');payFilter('Shop Received')");
    if (d.pendingDelivery) a += alertCard(t('al_delivery'), d.pendingDelivery, "go('custs')");
    $('alerts').innerHTML = a;

function openDealForm() {

function calcDeal() {
  var tp = Number($('d_totalPrice').value) || 0, a = Number($('d_advance').value) || 0, n = Number($('d_installments').value) || 0, cost = Number($('d_costPrice').value) || 0;
  if (!tp || !n) { $('dealCalc').innerHTML = t('monthly_inst') + ': -'; return; }
  $('dealCalc').innerHTML = '<div class="row"><span>' + t('remaining_amt') + '</span><b class="num">' + money(tp - a) + '</b></div>' +
    '<div class="row"><span>' + t('monthly_inst') + '</span><b class="num" style="color:var(--navy)">' + money(Math.round((tp - a) / n)) + ' × ' + n + '</b></div>' +
    (cost ? '<div class="row"><span>' + t('profit') + '</span><b class="num" style="color:var(--green)">' + money(tp - cost) + '</b></div>' : '');
  if ($('d_chequeAmount')._auto) $('d_chequeAmount').value = tp - a;
}
$('d_chequeAmount') && $('d_chequeAmount').addEventListener('input', function () { this._auto = false; });

function scanSimple(input, kind, map) {
  if (!input.files.length) return;
  toast(t('scanning'));
  readImage(input, 2000).then(function (img) { return api('scan', [PWD, kind, img], true); }).then(function (r) {
    var n = 0;
    for (var k in map) { if (r.fields[k]) { $(map[k]).value = r.fields[k]; n++; } }
    toast(n ? t('scan_filled', { n: n }) : t('scan_none'), !n);
  }).catch(adminFail);
}
function scanProduct(input) { scanSimple(input, 'product', { company: 'd_company', model: 'd_model', serial: 'd_serial', color: 'd_color', specs: 'd_specs' }); }
function scanCheque(input) { scanSimple(input, 'cheque', { bank: 'd_chequeBank', account: 'd_chequeAccount', chequeNo: 'd_chequeNo', holder: 'd_chequeHolder' }); }

function scanBarcode() {
  if (typeof Html5Qrcode === 'undefined') { toast(t('scanner_fail'), true); return; }
  modal('<h3>' + t('barcode_title') + '</h3><p class="muted">' + t('barcode_hint') + '</p><div id="reader" style="width:100%"></div><button class="btn light block" onclick="closeModal()">' + t('close') + '</button>');
  var sc = new Html5Qrcode('reader');
  window._scanner = sc;
  sc.start({ facingMode: 'environment' }, { fps: 10, qrbox: { width: 280, height: 120 } }, function (text) {
    var digits = String(text).replace(/\D/g, '');
    if (digits.length >= 8) {
      $('d_serial').value = digits.length === 15 ? digits : text;
      toast('✅ ' + $('d_serial').value);
      closeModal();
    }
  }).catch(function () { toast(t('camera_fail'), true); });
}

function saveDeal() {
  var d = { customerId: curCust.customer.id };
  ['itemType', 'company', 'model', 'color', 'specs', 'serial', 'costPrice', 'cashPrice', 'totalPrice', 'advance', 'installments', 'firstDueDate', 'notes',
    'chequeBank', 'chequeAccount', 'chequeNo', 'chequeHolder', 'chequeAmount'].forEach(function (k) { d[k] = $('d_' + k).value.trim(); });
  if (!d.company || !d.model || !(Number(d.totalPrice) > 0) || !(Number(d.installments) > 0) || !d.firstDueDate) { toast(t('need_deal'), true); return; }
  if (Number(d.advance) >= Number(d.totalPrice)) { toast(t('adv_too_big'), true); return; }
  busy(true);
  readImages({ delivery: 'f_delivery', cheque: 'f_cheque' }).then(function (files) {
    d.files = files;
    return api('addDeal', [PWD, d]);
  }).then(function (r) {
    var c = curCust.customer;
    var msg = t('wa_deal', { shop: SHOP.shopName, name: c.name, acc: r.accountNo, item: d.company + ' ' + d.model, total: money(d.totalPrice),
      adv: money(d.advance), monthly: money(r.monthly), n: d.installments, url: portalUrl() });
    modal('<h3 style="color:var(--green)">' + t('deal_saved') + '</h3><div class="row"><span>' + t('account_no') + '</span><b class="num">' + r.accountNo + '</b></div>' +
      '<div class="row"><span>' + t('monthly_inst') + '</span><b class="num">' + money(r.monthly) + '</b></div>' +
      '<a class="btn wa block" target="_blank" href="' + waLink(waNum(c.mobile), msg) + '">' + t('send_details_wa') + '</a>' +
      '<button class="btn light block" onclick="closeModal();openCustomer(curCust.customer.id,true)">' + t('ok') + '</button>');
  }).catch(adminFail);
}

// ---------- Logins & registrations ----------
function loginFilter(s) {
  curLoginStatus = s;
  var b = $('loginSubtabs').querySelectorAll('button');
  for (var i = 0; i < b.length; i++) b[i].classList.toggle('active', b[i].getAttribute('data-s') === s);
  api('listLogins', [PWD, s], true).then(function (list) {
    if (!list.length) { $('loginList').innerHTML = '<div class="card muted">' + t('no_records') + '</div>'; return; }
    $('loginList').innerHTML = list.map(function (l) {
      var act = l.status === 'Pending'
        ? '<button class="btn green sm" onclick="approveLogin(\'' + l.mobile + '\')">' + t('approve') + '</button><button class="btn red sm" onclick="rejectLogin(\'' + l.mobile + '\')">' + t('btn_reject') + '</button>' : '';
      return '<div class="card"><div class="row"><b>' + esc(l.customerName) + '</b>' + badge(l.status) + '</div>' +
        (l.source === 'Self' ? '<span class="badge b-Pending">' + t('self_registered') + '</span>' : '') +
        '<div class="row"><span class="muted">' + t('mobile') + '</span><span class="num">' + esc(l.mobile) + '</span></div>' +
        '<div class="row"><span class="muted">' + t('req_terms') + '</span><span class="num">' + esc(l.termsAcceptedAt) + '</span></div>' +
        (l.approvedAt ? '<div class="row"><span class="muted">' + t('approved_at') + '</span><span class="num">' + esc(l.approvedAt) + '</span></div>' : '') +
        (l.rejectReason ? '<div class="muted">' + t('reason') + ': ' + esc(l.rejectReason) + '</div>' : '') +
        '<button class="btn light sm" onclick="openCustomer(\'' + l.customerId + '\')">' + t('view_details') + '</button>' + act + '</div>';
    }).join('');
  }).catch(adminFail);
}
function approveLogin(m) {
  if (!confirm(t('approve_q'))) return;
  api('approveLogin', [PWD, m]).then(function (r) {
    var msg = t('wa_approved', { shop: SHOP.shopName, name: r.customerName, url: portalUrl() });
    modal('<h3 style="color:var(--green)">' + t('approved_ok') + '</h3><a class="btn wa block" target="_blank" href="' + waLink(r.waNumber, msg) + '">' + t('notify_customer') + '</a><button class="btn light block" onclick="closeModal();refreshPage()">' + t('close') + '</button>');
    if (currentPage() === 'logins') loginFilter(curLoginStatus);
  }).catch(adminFail);
}
function rejectLogin(m) {
  var reason = prompt(t('reject_reason_q'), '');
  if (reason === null) return;
  api('rejectLogin', [PWD, m, reason]).then(function () { toast(t('rejected_ok')); refreshPage(); }).catch(adminFail);
}

// ---------- Settings ----------
function saveSettings(what) {
  var s = {};
  if (what === 'mobile') { s.shopMobile = $('s_mobile').value.trim(); if (!s.shopMobile) return; }
  if (what === 'pwd') {
    if ($('s_pwd1').value.length < 4) { toast(t('pwd_short'), true); return; }
    if ($('s_pwd1').value !== $('s_pwd2').value) { toast(t('pwd_mismatch'), true); return; }
    s.newPassword = $('s_pwd1').value;
  }
  api('updateSettings', [PWD, s]).then(function () {
    toast(t('saved'));
    if (s.newPassword) { PWD = s.newPassword; store('mhm_admin', PWD); $('s_pwd1').value = ''; $('s_pwd2').value = ''; }
  }).catch(adminFail);
}

// ---------- Start ----------
applyLang();
fillItemTypes();
(function () {
  var p = load('mhm_admin');
  if (p) { $('pwd').value = p; login(); }
})();
</script>
<script>if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () {});</script>
</body>
